# pytest.ini — retained for deterministic async test behavior (pytest-asyncio).
# asyncio_mode/auto + function-scoped loop are required for the NextGen async suite.
#
# filterwarnings: ignore::DeprecationWarning is retained solely for known
# upstream pytest-asyncio / asyncio loop-scope DeprecationWarnings that do not
# represent security or runtime errors. It does NOT suppress:
#   - UserWarning, RuntimeWarning, ResourceWarning
#   - security-related warnings
#   - test failures or assertion errors
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
