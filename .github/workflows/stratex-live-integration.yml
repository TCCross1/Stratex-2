name: Stratex Live Integration (RT-002)

# Remote live proof: real MongoDB replica-set transactions + MinIO object storage.
# When C-P-003 modules are present in the checked-out tree, also runs
# LIVE_CP003_PUBLICATION_RECOVERY_PROOF against the exact PR SHA (no older worktree).
# Production readiness: NOT READY. Synthetic data and ephemeral credentials only.
# No deployment. No production secrets. No auto-merge.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stratex-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-integration:
    name: Live Mongo + object storage proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RT002_LIVE: "1"
      CP003_LIVE: "1"
      RT002_DB_NAME: stratex_rt002_ci
      # Tests run inside compose network — use service DNS names.
      RT002_MONGO_URL: mongodb://mongo1:27017/?replicaSet=rs0
      RT002_MINIO_ENDPOINT: http://minio:9000
      RT002_MINIO_BUCKET: stratex-rt002
      # Ephemeral credentials generated in-job (never printed).
      # Leave COMPOSE_PROJECT_NAME unset so compose `name: stratex-rt001` applies.

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Exact PR head SHA — never the ephemeral merge ref for pull_request events.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Record exact tested SHA
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "LIVE_TESTED_SHA=$SHA"
          echo "LIVE_TESTED_SHA=$SHA" >> "$GITHUB_ENV"
          EXPECTED="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$SHA" = "$EXPECTED"
          echo "Exact head SHA confirmed: $SHA"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test-only dependencies
        run: |
          python -m pip install --upgrade pip
          # Pinned, minimally scoped for live proof (disclosed).
          pip install \
            "pymongo==4.10.1" \
            "boto3==1.34.0" \
            "pytest==8.3.4" \
            "pyyaml==6.0.2"

      - name: Generate ephemeral MinIO credentials
        run: |
          USER="rt002ci$(openssl rand -hex 4)"
          PASS="$(openssl rand -hex 24)"
          echo "::add-mask::$USER"
          echo "::add-mask::$PASS"
          echo "RT002_MINIO_ACCESS_KEY=$USER" >> "$GITHUB_ENV"
          echo "RT002_MINIO_SECRET_KEY=$PASS" >> "$GITHUB_ENV"
          echo "RT001_MINIO_ROOT_USER=$USER" >> "$GITHUB_ENV"
          echo "RT001_MINIO_ROOT_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "MINIO_ROOT_USER=$USER" >> "$GITHUB_ENV"
          echo "MINIO_ROOT_PASSWORD=$PASS" >> "$GITHUB_ENV"
          # Do not echo credential values.

      - name: Detect in-tree C-P-003 modules
        id: cp003
        run: |
          if [[ -f backend/nextgen/outbox_worker.py ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "C-P-003 modules present in checkout SHA=$(git rev-parse HEAD)"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "C-P-003 modules absent — RT-002 regression only"
          fi

      - name: Verify committed immutable image digests pull
        run: |
          set -euo pipefail
          MONGO_REF=$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open("engineering/rt002/IMAGE_DIGESTS.yaml"))["images"]["mongo"]["reference"])
          PY
          )
          MINIO_REF=$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open("engineering/rt002/IMAGE_DIGESTS.yaml"))["images"]["minio"]["reference"])
          PY
          )
          MC_REF=$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open("engineering/rt002/IMAGE_DIGESTS.yaml"))["images"]["minio_mc"]["reference"])
          PY
          )
          PYTHON_REF=$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open("engineering/rt002/IMAGE_DIGESTS.yaml"))["images"]["python_harness"]["reference"])
          PY
          )
          echo "Pulling mongo reference (digest pinned)"
          docker pull "$MONGO_REF"
          echo "Pulling minio reference (digest pinned)"
          docker pull "$MINIO_REF"
          echo "Pulling mc reference (digest pinned)"
          docker pull "$MC_REF"
          echo "Pulling python harness reference (digest pinned)"
          docker pull "$PYTHON_REF"
          docker image inspect "$MONGO_REF" --format '{{index .RepoDigests 0}}'
          docker image inspect "$MINIO_REF" --format '{{index .RepoDigests 0}}'
          docker image inspect "$MC_REF" --format '{{index .RepoDigests 0}}'
          docker image inspect "$PYTHON_REF" --format '{{index .RepoDigests 0}}'
          echo "PYTHON_HARNESS_REF=$PYTHON_REF" >> "$GITHUB_ENV"

      - name: Start RT-001 compose stack (digest-pinned)
        run: |
          set -euo pipefail
          export RT001_MONGO_PORT=27018
          export RT001_MINIO_API_PORT=9000
          export RT001_MINIO_CONSOLE_PORT=9001
          test -n "${RT001_MINIO_ROOT_USER:-}"
          test -n "${RT001_MINIO_ROOT_PASSWORD:-}"
          export RT001_MINIO_BUCKET="${RT002_MINIO_BUCKET}"
          chmod +x engineering/rt001/start.sh engineering/rt001/stop.sh
          ./engineering/rt001/start.sh
          for i in $(seq 1 60); do
            if docker exec stratex-rt001-mongo1 mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              echo "mongo primary ready"
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9000/minio/health/live >/dev/null; then
              echo "minio ready"
              break
            fi
            sleep 2
          done
          for i in $(seq 1 30); do
            st="$(docker inspect -f '{{.State.Status}}' stratex-rt001-minio-init 2>/dev/null || echo missing)"
            if [[ "$st" == "exited" ]]; then
              code="$(docker inspect -f '{{.State.ExitCode}}' stratex-rt001-minio-init)"
              test "$code" = "0"
              echo "minio-init exited 0"
              break
            fi
            sleep 1
          done
          docker exec stratex-rt001-mongo1 mongosh --quiet --eval 'db.hello().setName'
          curl -sf http://127.0.0.1:9000/minio/health/live
          python - <<'PY'
          import os, boto3
          from botocore.client import Config
          c = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              aws_access_key_id=os.environ["RT002_MINIO_ACCESS_KEY"],
              aws_secret_access_key=os.environ["RT002_MINIO_SECRET_KEY"],
              region_name="us-east-1",
              config=Config(signature_version="s3v4", s3={"addressing_style": "path"}),
          )
          print("minio_auth_buckets=", len(c.list_buckets().get("Buckets") or []))
          PY
          NET="$(docker network ls --format '{{.Name}}' | grep -E 'stratex.*default' | head -1)"
          echo "Detected compose network: $NET"
          test -n "$NET"
          echo "RT001_NETWORK=$NET" >> "$GITHUB_ENV"

      - name: Run live integration tests on compose network
        env:
          MONGO_URL: ${{ env.RT002_MONGO_URL }}
          DB_NAME: ${{ env.RT002_DB_NAME }}
          PYTHONPATH: /work/backend
        run: |
          set -euo pipefail
          CP003_PRESENT="${{ steps.cp003.outputs.present }}"
          # Exact checkout SHA — never fetch an older PR #7 worktree for acceptance.
          echo "LIVE_TESTED_SHA=$(git rev-parse HEAD)"
          EXTRA=""
          if [[ "$CP003_PRESENT" == "true" ]]; then
            EXTRA="backend/tests/test_cp003_live_publication_recovery.py"
          fi
          # Digest-pinned harness — never floating python:3.12-slim (RT-003).
          test -n "${PYTHON_HARNESS_REF:-}"
          docker run --rm --network "${RT001_NETWORK}" \
            -v "$PWD:/work" \
            -w /work \
            -e RT002_LIVE=1 \
            -e CP003_LIVE=1 \
            -e RT002_MONGO_URL \
            -e RT002_MINIO_ENDPOINT \
            -e RT002_MINIO_ACCESS_KEY \
            -e RT002_MINIO_SECRET_KEY \
            -e RT002_MINIO_BUCKET \
            -e MINIO_ROOT_USER="${RT002_MINIO_ACCESS_KEY}" \
            -e MINIO_ROOT_PASSWORD="${RT002_MINIO_SECRET_KEY}" \
            -e RT002_DB_NAME \
            -e MONGO_URL \
            -e DB_NAME \
            -e PYTHONPATH=/work/backend \
            "${PYTHON_HARNESS_REF}" \
            bash -lc "
              set -euo pipefail
              pip install -q pymongo==4.10.1 boto3==1.34.0 pytest==8.3.4 pyyaml==6.0.2
              python -m pytest \
                backend/tests/test_rt002_live_mongo.py \
                backend/tests/test_rt002_live_object_storage.py \
                ${EXTRA} \
                -m 'live_mongo or live_object_storage or cp003_live' \
                -v -rs --tb=short
            "

      - name: Architecture and security gates
        env:
          STRATEX_VERIFY_ALLOW_DIRTY: "1"
          MONGO_URL: mongodb://127.0.0.1:27018/?replicaSet=rs0
          DB_NAME: stratex_rt002_ci
        run: |
          chmod +x ./stratex
          ./stratex verify --architecture
          ./stratex verify --security

      - name: Teardown
        if: always()
        run: |
          ./engineering/rt001/stop.sh || true
          docker compose -f engineering/rt001/docker-compose.yml down -v || true
