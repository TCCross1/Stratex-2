# RT-001 local integration stack — Mongo replica set + MinIO
# Production readiness: NOT READY. Local/dev + CI live-proof scaffolding.
# Immutable digests: engineering/rt002/IMAGE_DIGESTS.yaml (RT-002).
# Base main: 219485d46d3ff2e66463f280c4fd10ddd8e78b57

name: stratex-rt001

services:
  mongo1:
    image: mongo:7.0@sha256:9bdaeb6dac6e7e762e84e2f84103d1f9bb078fa1ba6bde8bb9d2274f655ad173
    hostname: mongo1
    container_name: stratex-rt001-mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "${RT001_MONGO_PORT:-27018}:27017"
    volumes:
      - rt001_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  mongo-init:
    image: mongo:7.0@sha256:9bdaeb6dac6e7e762e84e2f84103d1f9bb078fa1ba6bde8bb9d2274f655ad173
    container_name: stratex-rt001-mongo-init
    depends_on:
      mongo1:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        mongosh --host mongo1:27017 --quiet --eval '
          try {
            const s = rs.status();
            if (s.ok) { quit(0); }
          } catch (e) {}
          rs.initiate({
            _id: "rs0",
            members: [{ _id: 0, host: "mongo1:27017" }]
          });
        '
        for i in $(seq 1 60); do
          state=$(mongosh --host mongo1:27017 --quiet --eval 'rs.isMaster().ismaster' || true)
          if [ "$$state" = "true" ]; then
            echo "replica set primary ready"
            exit 0
          fi
          sleep 1
        done
        echo "replica set init timed out" >&2
        exit 1

  minio:
    # Digest-pinned RELEASE tag — NOT :latest. Production readiness: NOT READY.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: stratex-rt001-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${RT001_MINIO_ROOT_USER:-rt001minio}"
      MINIO_ROOT_PASSWORD: "${RT001_MINIO_ROOT_PASSWORD:-rt001minio-change-me}"
    ports:
      - "${RT001_MINIO_API_PORT:-9000}:9000"
      - "${RT001_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rt001_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: stratex-rt001-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      RT001_MINIO_ROOT_USER: "${RT001_MINIO_ROOT_USER:-rt001minio}"
      RT001_MINIO_ROOT_PASSWORD: "${RT001_MINIO_ROOT_PASSWORD:-rt001minio-change-me}"
      RT001_MINIO_BUCKET: "${RT001_MINIO_BUCKET:-stratex-rt001}"
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$RT001_MINIO_ROOT_USER" "$$RT001_MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/"$$RT001_MINIO_BUCKET"
        echo "minio bucket ready"

volumes:
  rt001_mongo_data:
  rt001_minio_data:
