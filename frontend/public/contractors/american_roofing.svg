<?xml version="1.0" encoding="UTF-8"?>
<!-- American Roofing Company — primary lock-up.
     Faithful reconstruction from the customer-supplied reference: red double
     gabled roof glyph, white "American" wordmark, red "Roofing Company"
     band. Provided as resolution-independent SVG so it renders crisply at
     any size in dashboards, headers, and 11×17 tabloid PDF deliverables.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" preserveAspectRatio="xMidYMid meet" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- ===== ROOF GLYPH (double-gable, red on white) ===== -->
  <g transform="translate(40,30)">
    <!-- left columns (gray) -->
    <rect x="6"  y="56" width="22" height="118" fill="#9CA3AF"/>
    <rect x="34" y="56" width="22" height="118" fill="#9CA3AF"/>
    <!-- right columns (gray) -->
    <rect x="60" y="56" width="22" height="118" fill="#9CA3AF"/>
    <rect x="88" y="56" width="22" height="118" fill="#9CA3AF"/>

    <!-- red double-peak roof -->
    <path d="M 0 70 L 56 8 L 112 70 L 95 70 L 56 26 L 17 70 Z" fill="#D7282F"/>
    <path d="M 8 90 L 56 32 L 104 90 L 96 96 L 56 50 L 16 96 Z" fill="#D7282F"/>

    <!-- horizontal beam under second roof -->
    <rect x="0" y="92" width="112" height="10" fill="#D7282F"/>

    <!-- floor base -->
    <rect x="0" y="174" width="116" height="8" fill="#9CA3AF"/>
  </g>

  <!-- ===== WORDMARK ===== -->
  <g transform="translate(190,84)">
    <!-- AMERICAN — silver gradient -->
    <defs>
      <linearGradient id="amSilver" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#FFFFFF"/>
        <stop offset="60%" stop-color="#E2E8F0"/>
        <stop offset="100%" stop-color="#94A3B8"/>
      </linearGradient>
    </defs>
    <text x="0" y="0" font-size="100" font-weight="800" letter-spacing="-2"
          fill="url(#amSilver)">American</text>

    <!-- divider rule -->
    <line x1="0" y1="22" x2="540" y2="22" stroke="#D7282F" stroke-width="3"/>

    <!-- ROOFING COMPANY — red caps -->
    <text x="0" y="78" font-size="56" font-weight="800" letter-spacing="6"
          fill="#D7282F">Roofing Company</text>
  </g>
</svg>
