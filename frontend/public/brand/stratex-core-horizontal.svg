<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" fill="none" role="img" aria-label="Stratex Core">
  <defs>
    <linearGradient id="h-hex-outer" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4DF6FF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#4DF6FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF7B00" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="h-house-metal" x1="60" y1="60" x2="140" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F4F6F9"/>
      <stop offset="0.5" stop-color="#B4BCC7"/>
      <stop offset="1" stop-color="#5A6472"/>
    </linearGradient>
    <linearGradient id="metal-word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#C6CED7"/>
      <stop offset="1" stop-color="#7A828E"/>
    </linearGradient>
    <linearGradient id="metal-word-2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE2EA"/>
      <stop offset="0.55" stop-color="#8892A0"/>
      <stop offset="1" stop-color="#3D444F"/>
    </linearGradient>
    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Emblem (compact, left) -->
  <g transform="translate(0,0)">
    <polygon points="100,20 172,58 172,142 100,180 28,142 28,58" stroke="url(#h-hex-outer)" stroke-width="3.5" fill="none" filter="url(#h-glow)"/>
    <polygon points="100,40 154,68 154,132 100,160 46,132 46,68" stroke="#3A6D75" stroke-width="1.1" fill="#040A12"/>
    <path d="M100 62 L136 92 L136 134 L64 134 L64 92 Z" fill="url(#h-house-metal)" stroke="#DFE6EE" stroke-width="1"/>
    <g fill="#4DF6FF">
      <rect x="86" y="106" width="12" height="12" rx="1"/>
      <rect x="102" y="106" width="12" height="12" rx="1"/>
      <rect x="86" y="122" width="12" height="10" rx="1"/>
      <rect x="102" y="122" width="12" height="10" rx="1"/>
    </g>
    <line x1="6" y1="100" x2="26" y2="100" stroke="#4DF6FF" stroke-width="2" opacity="0.85"/>
    <line x1="174" y1="100" x2="196" y2="100" stroke="#FF7B00" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- Wordmark: STRAT + orange X -->
  <g transform="translate(210, 62)" font-family="'Michroma','Rajdhani','Segoe UI',sans-serif" font-weight="700">
    <text x="0" y="66" font-size="80" fill="url(#metal-word)" letter-spacing="4">STRAT</text>
    <text x="252" y="66" font-size="86" fill="#FF7B00" letter-spacing="2">X</text>
    <text x="315" y="18" font-size="14" fill="#B4BCC7" letter-spacing="1">TM</text>
  </g>

  <!-- CORE subtitle bar -->
  <g transform="translate(214, 138)">
    <line x1="0" y1="10" x2="24" y2="10" stroke="#4DF6FF" stroke-width="1.4" opacity="0.85"/>
    <text x="34" y="15" font-family="'Michroma','Rajdhani','Segoe UI',sans-serif" font-size="22" fill="#4DF6FF" letter-spacing="8" font-weight="500">CORE</text>
    <line x1="150" y1="10" x2="240" y2="10" stroke="#4DF6FF" stroke-width="1.4" opacity="0.85"/>
    <text x="243" y="4" font-family="'Segoe UI',sans-serif" font-size="9" fill="#4DF6FF" opacity="0.9">TM</text>
  </g>
</svg>
