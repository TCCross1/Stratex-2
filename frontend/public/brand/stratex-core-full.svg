<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" fill="none" role="img" aria-label="Stratex Core — Property Intelligence Platform">
  <defs>
    <linearGradient id="f-hex-outer" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4DF6FF" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#4DF6FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF7B00" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="f-house-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6F9"/>
      <stop offset="0.5" stop-color="#AAB2BE"/>
      <stop offset="1" stop-color="#4A5460"/>
    </linearGradient>
    <linearGradient id="f-metal-word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#C6CED7"/>
      <stop offset="1" stop-color="#6E7683"/>
    </linearGradient>
    <filter id="f-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cy-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Emblem centered -->
  <g transform="translate(300, 24)">
    <polygon points="100,20 172,58 172,182 100,220 28,182 28,58" stroke="url(#f-hex-outer)" stroke-width="4" fill="none" filter="url(#f-glow)"/>
    <polygon points="100,44 154,74 154,166 100,196 46,166 46,74" stroke="#3A6D75" stroke-width="1.2" fill="#050B14" opacity="0.9"/>
    <path d="M100 72 L138 108 L138 158 L62 158 L62 108 Z" fill="url(#f-house-metal)" stroke="#DFE6EE" stroke-width="1.2"/>
    <g fill="#4DF6FF">
      <rect x="86" y="126" width="12" height="12" rx="1"/>
      <rect x="102" y="126" width="12" height="12" rx="1"/>
      <rect x="86" y="142" width="12" height="12" rx="1"/>
      <rect x="102" y="142" width="12" height="12" rx="1"/>
    </g>
    <line x1="-14" y1="120" x2="26" y2="120" stroke="#4DF6FF" stroke-width="2.4" opacity="0.85" filter="url(#cy-soft)"/>
    <line x1="174" y1="120" x2="214" y2="120" stroke="#FF7B00" stroke-width="2.4" opacity="0.9" filter="url(#cy-soft)"/>
  </g>

  <!-- STRATEX Wordmark -->
  <g transform="translate(400, 380)" text-anchor="middle" font-family="'Michroma','Rajdhani','Segoe UI',sans-serif" font-weight="700">
    <text y="0" font-size="106" fill="url(#f-metal-word)" letter-spacing="6">
      <tspan>STRAT</tspan><tspan fill="#FF7B00">X</tspan>
    </text>
    <text x="240" y="-64" font-family="'Segoe UI',sans-serif" font-size="16" fill="#B4BCC7">TM</text>
  </g>

  <!-- CORE subtitle -->
  <g transform="translate(400, 438)" text-anchor="middle">
    <line x1="-160" y1="14" x2="-80" y2="14" stroke="#4DF6FF" stroke-width="1.5" opacity="0.85"/>
    <line x1="80" y1="14" x2="160" y2="14" stroke="#4DF6FF" stroke-width="1.5" opacity="0.85"/>
    <text y="20" font-family="'Michroma','Rajdhani','Segoe UI',sans-serif" font-size="30" fill="#4DF6FF" letter-spacing="14" font-weight="500">CORE</text>
    <text x="86" y="0" font-family="'Segoe UI',sans-serif" font-size="11" fill="#4DF6FF" opacity="0.9">TM</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(400, 502)" text-anchor="middle" font-family="'Rajdhani','Segoe UI',sans-serif">
    <text y="0" font-size="19" fill="#DFE6EE" letter-spacing="5" font-weight="500">
      <tspan>ONE PROPERTY.</tspan>
      <tspan dx="10">ONE RECORD.</tspan>
      <tspan dx="10" fill="#4DF6FF">LIFETIME INTELLIGENCE.</tspan>
    </text>
  </g>

  <!-- Platform tag -->
  <g transform="translate(400, 558)" text-anchor="middle">
    <line x1="-190" y1="-6" x2="-150" y2="-6" stroke="#4DF6FF" stroke-width="1" opacity="0.6"/>
    <line x1="150" y1="-6" x2="190" y2="-6" stroke="#4DF6FF" stroke-width="1" opacity="0.6"/>
    <text y="0" font-family="'Michroma','Rajdhani','Segoe UI',sans-serif" font-size="13" fill="#4DF6FF" letter-spacing="8" opacity="0.9">PROPERTY INTELLIGENCE PLATFORM</text>
  </g>
</svg>
